# Railway project configuration
# This monorepo deploys as 3 separate Railway services.
# See docs/deployment.md for full setup instructions.
#
# NOTE: Per-service build/start commands are configured in the Railway
# dashboard (not here) because all 3 services share this single file.
# This file provides shared build and deploy defaults.

[build]
builder = "NIXPACKS"
nixPkgs = ["nodejs_22", "python3"]
aptPkgs = ["build-essential", "libudev-dev"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
